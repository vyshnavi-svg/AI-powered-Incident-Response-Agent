<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Runbook - Emergent Agent Workspace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    header {
      height: 48px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .external-link {
      color: #38bdf8;
      text-decoration: none;
      font-size: 13px;
    }
    .external-link:hover {
      text-decoration: underline;
    }
    .container {
      width: 100%;
      height: calc(100vh - 48px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Auto Runbook Preview</div>
    <a href="https://auto-runbook.preview.emergentagent.com/" target="_blank" rel="noopener noreferrer" class="external-link">Open in New Tab ↗</a>
  </header>
  <div class="container">
    <iframe src="https://auto-runbook.preview.emergentagent.com/" title="Auto Runbook Emergent Agent"></iframe>
  </div>
</body>
</html>
